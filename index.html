<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitMart - Fitness Gear and Nutrition Marketplace</title>
</head>

<body>

  <h1>FitMart</h1>
  <h3>Fitness Gear and Nutrition Marketplace</h3>


  <h2>1. Login Form</h2>

  <form>
    <label for="loginEmail">Email:</label>
    <input type="email" id="loginEmail" name="loginEmail" required>
    <br><br>

    <label for="loginPassword">Password:</label>
    <input type="password" id="loginPassword" name="loginPassword" required>
    <br><br>

    <input type="submit" value="Login">
    <input type="reset" value="Clear">
  </form>

  <hr>
  <h2>2. Sign Up Form</h2>

  <form>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" required>
    <br><br>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" required>
    <br><br>

    <label for="signupEmail">Email:</label>
    <input type="email" id="signupEmail" name="signupEmail" required>
    <br><br>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <br><br>

    <label for="signupPassword">Password:</label>
    <input type="password" id="signupPassword" name="signupPassword" required>
    <br><br>

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
    <br><br>

    <label for="dateOfBirth">Date of Birth:</label>
    <input type="date" id="dateOfBirth" name="dateOfBirth">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <input type="submit" value="Sign Up">
    <input type="reset" value="Clear">
  </form>

  <hr>


  <h2>3. Fitness Gear and Nutrition Marketplace Form</h2>

  <form>
    <label for="customerFirstName">First Name:</label>
    <input type="text" id="customerFirstName" name="customerFirstName" required>
    <br><br>

    <label for="customerLastName">Last Name:</label>
    <input type="text" id="customerLastName" name="customerLastName" required>
    <br><br>

    <b>Customer Details</b>
    <br><br>

    <label for="customerEmail">Email:</label>
    <input type="email" id="customerEmail" name="customerEmail" required>
    <br><br>

    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone"
           pattern="[6-9][0-9]{9}" required>
    <br><br>

    <label for="productName">Product Name:</label>
    <input type="text" id="productName" name="productName" required>
    <br><br>

    <label for="category">Product Category:</label>
    <select id="category" name="category">
      <option>Fitness Gear</option>
      <option>Nutrition Supplements</option>
      <option>Protein Products</option>
      <option>Sportswear</option>
      <option>Workout Accessories</option>
    </select>
    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity"
           min="1" value="1" required>
    <br><br>

    <label>Product Type:</label>
    <input type="radio" name="productType" value="gear"> Fitness Gear
    <input type="radio" name="productType" value="nutrition"> Nutrition Product
    <br><br>

    <label for="deliveryDate">Expected Delivery Date:</label>
    <input type="date" id="deliveryDate" name="deliveryDate">
    <br><br>

    <label>Additional Features:</label>
    <br>

    <input type="checkbox" name="features" value="giftWrap"> Gift Wrapping
    <input type="checkbox" name="features" value="expressDelivery"> Express Delivery
    <input type="checkbox" name="features" value="orderUpdates"> Order Updates

    <br><br>

    <label for="specialRequests">Special Requests:</label>
    <br>

    <textarea id="specialRequests" name="specialRequests"
              rows="4" cols="35"
              placeholder="Enter your product requirements here"></textarea>

    <br><br>

    <input type="submit" value="Place Order">
    <input type="reset" value="Clear">
  </form>

</body>
</html>
